services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API Service (Express + Prisma + Node.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: lucky-gazab-api
    env: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:types && npm run build:api
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: lucky-gazab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lucky-gazab-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # ---------------------------------------------------------------------------
  # 2. Next.js Customer Storefront Application
  # ---------------------------------------------------------------------------
  - type: web
    name: lucky-gazab-storefront
    env: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:types && npm run build:storefront
    startCommand: npm run start --workspace=apps/storefront
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: lucky-gazab-api
          property: url
          suffix: /api/v1

  # ---------------------------------------------------------------------------
  # 3. Vite Admin Dashboard SPA (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: lucky-gazab-admin
    env: static
    region: singapore
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:types && npm run build:admin
    staticPublishPath: ./apps/admin/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------------------
# Databases & Caches
# ---------------------------------------------------------------------------
databases:
  - name: lucky-gazab-db
    databaseName: gazab_production_db
    user: gazab_admin
    region: singapore
    plan: free
